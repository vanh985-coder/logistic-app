name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @logix/api prisma:generate

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Linter
        run: pnpm run lint

  unit-and-e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logix
          POSTGRES_PASSWORD: logix_secret_dev
          POSTGRES_DB: logix3d_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @logix/api prisma:generate

      - name: Run database migration
        env:
          DATABASE_URL: "postgresql://logix:logix_secret_dev@localhost:5432/logix3d_db?schema=public"
        run: pnpm --filter @logix/api prisma:migrate

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://logix:logix_secret_dev@localhost:5432/logix3d_db?schema=public"
          DATABASE_URL_TEST: "postgresql://logix:logix_secret_dev@localhost:5432/logix3d_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "logix3d-super-secret-jwt-key-min-32-chars-2026"
        run: |
          pnpm run test
          pnpm run test:e2e


  build-docker-images:
    needs: [lint-and-typecheck, unit-and-e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: logix-api:latest

      - name: Build Worker Docker Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: logix-worker:latest

      - name: Build Web Docker Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: logix-web:latest
