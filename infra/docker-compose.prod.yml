version: '3.8'

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.22.0
    container_name: logix3d-pgbouncer
    restart: always
    environment:
      DB_USER: ${POSTGRES_USER:-logix}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-logix_secret_dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-logix3d_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 300
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      ADMIN_USERS: ${POSTGRES_USER:-logix}
      AUTH_TYPE: plain
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-logix}:${POSTGRES_PASSWORD:-logix_secret_dev}@pgbouncer:5432/${POSTGRES_DB:-logix3d_db}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-logix}:${POSTGRES_PASSWORD:-logix_secret_dev}@postgres:5432/${POSTGRES_DB:-logix3d_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    depends_on:
      - pgbouncer
      - redis
      - minio

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-logix}:${POSTGRES_PASSWORD:-logix_secret_dev}@pgbouncer:5432/${POSTGRES_DB:-logix3d_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - pgbouncer
      - redis

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: production
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
